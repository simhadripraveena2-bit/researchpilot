name: stack

# R0-1: the whole local stack builds and becomes healthy from a clean checkout.
on:
  push:  # every branch (the repository's development branch is not main)
  pull_request:
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and wait for health checks
        run: docker compose up --build --detach --wait
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/health/ready
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/projects \
            -H 'Content-Type: application/json' \
            -d '{"topic":"graph neural networks","expertise_level":"beginner","goal":"learn_field"}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
