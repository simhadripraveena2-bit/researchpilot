[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os
# The database URL comes from Settings (DATABASE_URL), see alembic/env.py.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
