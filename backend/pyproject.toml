[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot backend: evidence-driven research companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs PostgreSQL (DATABASE_URL / TEST_DATABASE_ADMIN_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests; production code uses explicit errors

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Provider and graph SDKs may only be imported inside their adapter packages
# (ARCHITECTURE §4.2 and §12.8). Everything else talks to the gateway/service interfaces.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Provider SDKs may only be imported in researchpilot.llm.adapters (use LLMGateway)."
"neo4j".msg = "The Neo4j driver may only be imported in researchpilot.graph.adapters.neo4j (use GraphService)."

[tool.ruff.lint.per-file-ignores]
"src/researchpilot/llm/adapters/anthropic_adapter.py" = ["TID251"]
"src/researchpilot/graph/adapters/neo4j/*" = ["TID251"]
"tests/**" = ["S", "TID251"]
"alembic/**" = ["S608"]
"alembic/versions/*" = ["E501"]  # embedded SQL

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researchpilot"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["researchpilot.db.*", "researchpilot.llm.adapters.anthropic_adapter"]
# SQLAlchemy/SDK typing is checked, but untyped decorators in these layers are tolerated.
disallow_untyped_decorators = false
